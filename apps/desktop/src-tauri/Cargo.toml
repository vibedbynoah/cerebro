[package]
name = "cerebro-desktop"
description = "Cerebro desktop shell: a Tauri v2 window around the SolidJS UI in ../ui, isolation pattern on, deny-by-default capabilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "cerebro_desktop"
path = "src/lib.rs"

[[bin]]
name = "cerebro-desktop"
path = "src/main.rs"

[build-dependencies]
# Exact pins: the shell's security boundary lives in these crates, so an upgrade is a reviewed change.
tauri-build = { version = "=2.7.0", default-features = false, features = ["config-json", "isolation"] }

[dependencies]
# No `devtools` feature: the inspector exists in debug builds only and is compiled out of release.
# No `dynamic-acl`: capabilities are fixed at build time and cannot be widened at runtime.
tauri = { version = "=2.12.0", default-features = false, features = ["wry", "compression", "common-controls-v6", "isolation", "x11", "dbus"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Cerebro's own inference engine (CUDA kernels built with nvcc; needs the MSVC environment).
cerebro-engine = { path = "../../../../cerebro-engine/crates/cerebro-engine" }
cerebro-probe = { path = "../../../crates/cerebro-probe" }
# Model Hub only: HTTPS to huggingface.co (rustls, no OpenSSL).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
# 256-bit secrets from the OS CSPRNG and constant-time comparison (src/secret.rs). Vetted crates only;
# nothing here is hand-rolled.
getrandom = "=0.3.4"
subtle = "=2.6.1"
# Wipes secrets from memory when they are dropped (src/secret.rs). Already in the tree through
# ed25519-dalek; pinned to the same version so the lockfile gains no new crate.
zeroize = { version = "=1.9.0", default-features = false }
# Ed25519 update signatures (src/update_sig.rs), verify_strict only.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"] }
# Phone access (src/remote.rs): TLS with the same rustls + aws-lc-rs the Hub already ships, a
# certificate made on this machine, Argon2id for the password, and the pairing QR as SVG.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
sha2 = "0.10"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[features]
# Set by `tauri build` for release bundles: serve the UI from the embedded assets, not the dev server.
custom-protocol = ["tauri/custom-protocol"]
# End-to-end test builds only: opens a WebView2 debugging port for scripts/e2e-real.mjs.
e2e = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
