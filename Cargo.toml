[workspace]
resolver = "2"
members = [
    "crates/cerebro-flags",
    "crates/cerebro-job",
    "crates/cerebro-probe",
    "crates/cerebro-supervisor",
    "crates/cerebro-bench",
    "crates/cerebro-store",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/noahmrauch/cerebro"
authors = ["Cerebro contributors"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# crates/cerebro-config is carried over but excluded until its duplicate DACL audit and spawn gate
# are replaced by cerebro-probe / cerebro-supervisor (see docs/RESTART.md).

