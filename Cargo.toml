[workspace]
resolver = "2"
members = [
    "crates/cerebro-flags",
    "crates/cerebro-probe",
    "crates/cerebro-supervisor",
    "crates/cerebro-bench",
    "crates/cerebro-store",
    "crates/cerebro-config",
    "crates/cerebro-backends",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/noahmrauch/cerebro"
authors = ["Cerebro contributors"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Preflight SHA-256s every backend .exe/.dll before each launch and restart (1.17 GB for the official
# CUDA build). Unoptimized, sha2 made that 25-46 s per launch in a debug build; with this override a
# debug build matches release (0.63 s warm page cache, 2.6 s first touch; measured 2026-09-24). Dev
# builds only; release already builds everything at opt-level 3.
[profile.dev.package.sha2]
opt-level = 3
