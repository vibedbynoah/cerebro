[package]
name = "cerebro-engine"
description = "Cerebro's own inference engine: GGUF reader, tokenizer, model graphs, quantised kernels, conversation and expert caches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
memmap2 = "0.9"
rayon = "1.10"
fancy-regex = "0.14"
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12080"], optional = true }
# Portable GPU backend: Vulkan / DX12 (AMD, Intel, NVIDIA) and Metal (Apple) through one set of WGSL shaders.
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["wgsl", "vulkan", "dx12", "metal"] }
pollster = { version = "0.4", optional = true }

[[bin]]
name = "cerebro-run"
path = "src/bin/run.rs"


[features]
default = ["cuda", "portable"]
cuda = ["dep:cudarc"]
portable = ["dep:wgpu", "dep:pollster"]
